<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JustShutApp</title>
<meta name="description" content="A call filter for India. Silences marketing calls before your phone rings.">
<meta name="color-scheme" content="light dark">
<style>
  :root { --bg:#101215; --fg:#ffffff; --muted:#a0a5ad; --rule:#2a2e34; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--fg); padding:24px;
    font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Open Sans",Roboto,sans-serif;
  }
  .card { max-width:26rem; text-align:center; }
  .mark { font-size:56px; line-height:1; margin-bottom:12px; }
  h1 { font-size:32px; letter-spacing:-0.6px; margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 28px; }
  nav { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  a {
    color:var(--fg); text-decoration:none; font-weight:600; font-size:15px;
    border:1px solid var(--rule); border-radius:10px; padding:10px 18px;
  }
  a:hover { border-color:var(--fg); }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">🛡️</div>
    <h1>JustShutApp</h1>
    <p>A call filter for India. Silences marketing calls before your phone rings.</p>
    <nav>
      <a href="privacy.html">Privacy policy</a>
    </nav>
  </div>
</body>
</html>
